name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS runs the hooks under the system bash 3.2 that Claude Code users on a Mac have
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Hook tests (en and zh)
        run: |
          status=0
          for t in en/hooks/tests/*.test.sh zh/hooks/tests/*.test.sh; do
            echo "::group::$t"
            bash "$t" || { echo "::error file=$t::$t failed"; status=1; }
            echo "::endgroup::"
          done
          exit "$status"

  pytest:
    name: skill script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Skill script tests (en and zh)
        # one pytest process per copy: both copies hold test modules of the same name
        run: |
          status=0
          for d in en/skills/*/scripts zh/skills/*/scripts; do
            ls "$d"/test_*.py >/dev/null 2>&1 || continue
            echo "::group::$d"
            python -m pytest -p no:cacheprovider "$d" || { echo "::error::$d failed"; status=1; }
            echo "::endgroup::"
          done
          exit "$status"

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint hook scripts, hook tests, skill scripts and repository scripts
        run: |
          shellcheck --version
          shellcheck --severity=warning \
            scripts/*.sh en/hooks/*.sh zh/hooks/*.sh \
            en/hooks/tests/*.sh zh/hooks/tests/*.sh \
            en/skills/*/scripts/*.sh zh/skills/*/scripts/*.sh

  parity:
    name: en/zh parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that en/ and zh/ are matching copies
        run: bash scripts/check-parity.sh
