<g id="caller">
<rect id="caller-box" x="600.75" y="530.75" width="338.5" height="58.5" rx="8" fill="#0c2d6b" stroke="#4493f8" stroke-width="1.5"/>
<text x="770" y="555" font-size="15" font-weight="600" text-anchor="middle" fill="#e6edf3" data-box="caller-box">发起调用的线程</text>
<text x="770" y="576" font-size="12.5" text-anchor="middle" fill="#9198a1" data-box="caller-box">主线程或子智能体</text>
</g>
<path d="M770,590 L770,640" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
<g id="pre">
<rect id="pre-box" x="600.75" y="640.75" width="338.5" height="252.5" rx="8" fill="#151b23" stroke="#9198a1" stroke-width="1.5"/>
<text x="616" y="666" font-size="15" font-weight="600" fill="#e6edf3" data-box="pre-box">PreToolUse</text>
<text x="924" y="666" font-size="12.5" text-anchor="end" fill="#9198a1" data-box="pre-box">工具执行之前</text>
<line x1="601.5" y1="678" x2="938.5" y2="678" stroke="#3d444d" stroke-width="1"/>
<text x="616" y="700" font-size="13.5" fill="#e6edf3" data-box="pre-box">拦嵌套派发（只在子智能体内）</text>
<text x="616" y="726" font-size="13.5" fill="#e6edf3" data-box="pre-box">拦 git commit --no-verify</text>
<text x="616" y="752" font-size="13.5" fill="#e6edf3" data-box="pre-box">密钥守卫：拦会打印密钥值的调用</text>
<text x="616" y="778" font-size="13.5" fill="#e6edf3" data-box="pre-box">只读守卫：researcher 与 retriever 子智能体</text>
<text x="628" y="798" font-size="13.5" fill="#e6edf3" data-box="pre-box">只准新建文件</text>
<text x="616" y="824" font-size="13.5" fill="#e6edf3" data-box="pre-box">交接守卫：拦直接改写 HANDOFF.md</text>
<text x="616" y="850" font-size="13.5" fill="#e6edf3" data-box="pre-box">生产合并闸门：生产仓库的 gh pr merge</text>
<text x="628" y="870" font-size="13.5" fill="#e6edf3" data-box="pre-box">等用户当场同意</text>
</g>
<path d="M770,894 L770,938" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="782" y="920" font-size="12.5" text-anchor="start" fill="#c9d1d9">放行</text>
<g id="tool">
<rect id="tool-box" x="600.75" y="938.75" width="338.5" height="40.5" rx="8" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
<text x="770" y="964" font-size="13.5" font-weight="600" text-anchor="middle" fill="#e6edf3" data-box="tool-box">工具执行</text>
</g>
<path d="M770,980 L770,1024" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
<g id="post">
<rect id="post-box" x="600.75" y="1024.75" width="338.5" height="128.5" rx="8" fill="#151b23" stroke="#9198a1" stroke-width="1.5"/>
<text x="616" y="1050" font-size="15" font-weight="600" fill="#e6edf3" data-box="post-box">PostToolUse</text>
<text x="924" y="1050" font-size="12.5" text-anchor="end" fill="#9198a1" data-box="post-box">工具执行之后</text>
<line x1="601.5" y1="1062" x2="938.5" y2="1062" stroke="#3d444d" stroke-width="1"/>
<text x="616" y="1084" font-size="13.5" fill="#e6edf3" data-box="post-box">规则文件提醒：改了规则文件时</text>
<text x="616" y="1110" font-size="13.5" fill="#e6edf3" data-box="post-box">工作树链接：进入新工作树时建软链，</text>
<text x="628" y="1130" font-size="13.5" fill="#e6edf3" data-box="post-box">只改磁盘，不回话</text>
</g>
<path d="M940,761 L1004,761 L1004,560 L940,560" fill="none" stroke="#f0883e" stroke-width="2" marker-end="url(#back)"/>
<text x="1018" y="640" font-size="12.5" font-weight="600" text-anchor="start" fill="#ffa657">拒绝：理由回到发起</text>
<text x="1018" y="658" font-size="12.5" text-anchor="start" fill="#ffa657">调用的线程，线程</text>
<text x="1018" y="676" font-size="12.5" text-anchor="start" fill="#ffa657">换一种做法</text>
<path d="M600,1084 L566,1084 L566,570 L600,570" fill="none" stroke="#f0883e" stroke-width="2" marker-end="url(#back)"/>
<text x="552" y="836" font-size="12.5" text-anchor="end" fill="#ffa657">工具结果与作为附加上下文的</text>
<text x="552" y="854" font-size="12.5" text-anchor="end" fill="#ffa657">规则文件提醒，回到发起</text>
<text x="552" y="872" font-size="12.5" text-anchor="end" fill="#ffa657">调用的线程</text>
<g id="limitpause">
<rect id="limit-box" x="1030.75" y="720.75" width="252.5" height="186.5" rx="8" fill="#151b23" stroke="#9198a1" stroke-width="1.5"/>
<text x="1046" y="746" font-size="15" font-weight="600" fill="#e6edf3" data-box="limit-box">限额暂停</text>
<line x1="1031.5" y1="758" x2="1282.5" y2="758" stroke="#3d444d" stroke-width="1"/>
<text x="1046" y="780" font-size="13.5" fill="#e6edf3" data-box="limit-box">5 小时用量到 95% 及以上：</text>
<text x="1046" y="800" font-size="13.5" fill="#e6edf3" data-box="limit-box">把调用挂起到重置；</text>
<text x="1046" y="820" font-size="13.5" fill="#e6edf3" data-box="limit-box">每 50 分钟拒绝一次，线程</text>
<text x="1046" y="840" font-size="13.5" fill="#e6edf3" data-box="limit-box">发出暂停调用，再被挂起</text>
<line x1="1031.5" y1="852" x2="1282.5" y2="852" stroke="#3d444d" stroke-width="1" stroke-dasharray="3 3"/>
<text x="1046" y="874" font-size="13.5" fill="#e6edf3" data-box="limit-box">放行：用户本人在 95% 之后</text>
<text x="1046" y="894" font-size="13.5" fill="#e6edf3" data-box="limit-box">的输入，最后一次保活唤醒</text>
</g>
<path d="M940,850 L1030,850" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="985" y="841" font-size="12.5" text-anchor="middle" fill="#c9d1d9">挂起</text>
<path d="M1030,745 L1004,745" fill="none" stroke="#f0883e" stroke-width="2"/>
<path d="M1056,908 L1056,959 L940,959" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="1068" y="937" font-size="12.5" text-anchor="start" fill="#c9d1d9">到重置时放行</text>
<g id="statusline">
<rect id="status-box" x="1030.75" y="1024.75" width="252.5" height="76.5" rx="8" fill="#151b23" stroke="#9198a1" stroke-width="1.5"/>
<text x="1157" y="1050" font-size="15" font-weight="600" text-anchor="middle" fill="#e6edf3" data-box="status-box">状态栏</text>
<text x="1157" y="1070" font-size="12.5" text-anchor="middle" fill="#9198a1" data-box="status-box">statusline-tee.sh 记下</text>
<text x="1157" y="1088" font-size="12.5" text-anchor="middle" fill="#9198a1" data-box="status-box">每次响应带来的 rate_limits</text>
</g>
<path d="M1230,1024 L1230,908" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="1218" y="985" font-size="12.5" text-anchor="end" fill="#c9d1d9">用量文件：</text>
<text x="1218" y="1003" font-size="12.5" text-anchor="end" fill="#c9d1d9">rate-limits.json</text>
<g id="legend">
<path d="M16,1110 L60,1110" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="72" y="1114.5" font-size="12.5" fill="#c9d1d9">调用或结果向前走</text>
<path d="M16,1136 L60,1136" fill="none" stroke="#f0883e" stroke-width="2" marker-end="url(#back)"/>
<text x="72" y="1140.5" font-size="12.5" fill="#ffa657">拦下、回弯或唤醒：控制回到线程</text>
</g>
</svg>
