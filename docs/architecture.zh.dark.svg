<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1174" viewBox="0 0 1300 1174" role="img" aria-label="架构图，画的是一轮工作怎样运行。会话开始、/clear 与压缩之后，SessionStart 钩子把编排手册注入主线程，子智能体收不到。用户本人键入的消息提到生产模式时，UserPromptSubmit 钩子给主线程注入一句说明，讲怎样设置与取消仓库的生产标记。主线程向子智能体发出派发说明，子智能体凭 agents/*.md 里设定了推理强度的定义、CLAUDE.md 与派发说明干活，交回有界回报。两条线程的每次工具调用在工具执行之前都经过 PreToolUse：子智能体内的嵌套派发、git commit --no-verify、会打印密钥值的调用、直接改写 HANDOFF.md，以及 researcher 或 retriever 子智能体改动、移动或删除已有文件的操作都被拒绝，researcher 与 retriever 子智能体读文件、跑命令与新建文件都放行；在标成生产的仓库里执行 gh pr merge，要等用户当场同意才执行；5 小时用量到 95% 及以上时，PreToolUse 里的限额暂停把两条线程的每次调用挂起到重置，每过 50 分钟拒绝一次被挂起的调用，线程随即发出暂停调用（: 限额暂停）并再被挂起，过了重置时间才放行；主线程里，用户本人在用量到 95% 之后发出的输入与缓存保活的最后一次唤醒不被挂起；限额暂停的用量取自本地文件，由状态栏包装把 Claude Code 传给状态栏的 rate_limits 记进这个文件；拒绝理由回到发起调用的线程，线程换一种做法；放行的调用交给工具执行。工具执行之后，PostToolUse 在改了规则文件时把规则文件提醒作为附加上下文送回发起调用的线程，在进入新工作树时把主检出目录中的 CLAUDE.md、node_modules 与 .env* 软链进这个工作树，不回话。主线程想结束这一轮时经过 Stop 钩子，都放行则这一轮结束，其中两个是同步闸门。上下文水位闸门过 35% 时每个会话提醒一次并放行，没有会话暂存目录时则每轮提醒，过 40% 拦一次，没有会话暂存目录时则每轮都拦，此后以上次拦截时的水位为基准，每再涨 5 个百分点就再拦一次；回复出口在回复末句是提议问句时拦一次，仅 zh/ 副本的安装里，较长的回复主要不是中文时也拦一次。这两个闸门拦下都回到主线程。被回复出口拦下，主线程要么直接把提议的那一步做掉，要么在确实需要用户拍板时按背景、各选项的后果与推荐的格式重新提问，因语言被拦时用中文重写。被水位闸门第一次拦下，已有上下文能做完的收尾就做完，接下来是新的大块工作时运行 handoff 技能，由 researcher 子智能体写出 HANDOFF.new.md，再由 finalize.sh 落位成交接文件，并提示用户换新会话；此后每次再被拦都立即生成交接文件。新会话读交接文件接着做。两个同步闸门都不会拦刚被自己拦下而续跑的那一轮，所以一次停止尝试最多被拦一次，这一轮再想停就放行；水位闸门在之后的轮次里仍会随用量上涨再拦。第三个 Stop 钩子缓存保活不拦停：它在这一轮结束后于后台计时，主线程上下文达到 150,000 词元且 50 分钟里没有新的一轮时，唤醒主线程只回一个句点，用户离开期间一小时的提示词缓存因此不过期；唤醒之前先探测 API，连不上就每 30 秒再探，到这一轮结束后 57 分钟仍连不上就放弃，因为再唤醒已来不及在缓存过期前续上。每次唤醒后照常重新计时，直到距用户本人最后一条消息满 8 小时；到上限前的最后一次唤醒，还有工作要接着做就让主线程用 handoff 技能写交接，否则只回一个句点。" font-family="system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif">
<title>架构图，画的是一轮工作怎样运行。会话开始、/clear 与压缩之后，SessionStart 钩子把编排手册注入主线程，子智能体收不到。用户本人键入的消息提到生产模式时，UserPromptSubmit 钩子给主线程注入一句说明，讲怎样设置与取消仓库的生产标记。主线程向子智能体发出派发说明，子智能体凭 agents/*.md 里设定了推理强度的定义、CLAUDE.md 与派发说明干活，交回有界回报。两条线程的每次工具调用在工具执行之前都经过 PreToolUse：子智能体内的嵌套派发、git commit --no-verify、会打印密钥值的调用、直接改写 HANDOFF.md，以及 researcher 或 retriever 子智能体改动、移动或删除已有文件的操作都被拒绝，researcher 与 retriever 子智能体读文件、跑命令与新建文件都放行；在标成生产的仓库里执行 gh pr merge，要等用户当场同意才执行；5 小时用量到 95% 及以上时，PreToolUse 里的限额暂停把两条线程的每次调用挂起到重置，每过 50 分钟拒绝一次被挂起的调用，线程随即发出暂停调用（: 限额暂停）并再被挂起，过了重置时间才放行；主线程里，用户本人在用量到 95% 之后发出的输入与缓存保活的最后一次唤醒不被挂起；限额暂停的用量取自本地文件，由状态栏包装把 Claude Code 传给状态栏的 rate_limits 记进这个文件；拒绝理由回到发起调用的线程，线程换一种做法；放行的调用交给工具执行。工具执行之后，PostToolUse 在改了规则文件时把规则文件提醒作为附加上下文送回发起调用的线程，在进入新工作树时把主检出目录中的 CLAUDE.md、node_modules 与 .env* 软链进这个工作树，不回话。主线程想结束这一轮时经过 Stop 钩子，都放行则这一轮结束，其中两个是同步闸门。上下文水位闸门过 35% 时每个会话提醒一次并放行，没有会话暂存目录时则每轮提醒，过 40% 拦一次，没有会话暂存目录时则每轮都拦，此后以上次拦截时的水位为基准，每再涨 5 个百分点就再拦一次；回复出口在回复末句是提议问句时拦一次，仅 zh/ 副本的安装里，较长的回复主要不是中文时也拦一次。这两个闸门拦下都回到主线程。被回复出口拦下，主线程要么直接把提议的那一步做掉，要么在确实需要用户拍板时按背景、各选项的后果与推荐的格式重新提问，因语言被拦时用中文重写。被水位闸门第一次拦下，已有上下文能做完的收尾就做完，接下来是新的大块工作时运行 handoff 技能，由 researcher 子智能体写出 HANDOFF.new.md，再由 finalize.sh 落位成交接文件，并提示用户换新会话；此后每次再被拦都立即生成交接文件。新会话读交接文件接着做。两个同步闸门都不会拦刚被自己拦下而续跑的那一轮，所以一次停止尝试最多被拦一次，这一轮再想停就放行；水位闸门在之后的轮次里仍会随用量上涨再拦。第三个 Stop 钩子缓存保活不拦停：它在这一轮结束后于后台计时，主线程上下文达到 150,000 词元且 50 分钟里没有新的一轮时，唤醒主线程只回一个句点，用户离开期间一小时的提示词缓存因此不过期；唤醒之前先探测 API，连不上就每 30 秒再探，到这一轮结束后 57 分钟仍连不上就放弃，因为再唤醒已来不及在缓存过期前续上。每次唤醒后照常重新计时，直到距用户本人最后一条消息满 8 小时；到上限前的最后一次唤醒，还有工作要接着做就让主线程用 handoff 技能写交接，否则只回一个句点。</title>
