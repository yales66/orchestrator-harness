<text x="616" y="988" font-size="13.5" fill="#e6edf3" data-box="post-box">工作树链接：进入新工作树时建软链，</text>
<text x="628" y="1008" font-size="13.5" fill="#e6edf3" data-box="post-box">只改磁盘，不回话</text>
</g>
<path d="M940,711 L1004,711 L1004,510 L940,510" fill="none" stroke="#f0883e" stroke-width="2" marker-end="url(#back)"/>
