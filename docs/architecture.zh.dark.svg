<text x="770" y="842" font-size="13.5" font-weight="600" text-anchor="middle" fill="#e6edf3" data-box="tool-box">工具执行</text>
</g>
<path d="M770,858 L770,902" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
<g id="post">
