<svg xmlns="http://www.w3.org/2000/svg" width="840" height="480" viewBox="0 0 840 480" role="img" aria-label="架构图：主线程（编排者）收到 CLAUDE.md、经 SessionStart 钩子注入的编排手册，以及按需加载的技能。主线程向子智能体发出派发说明；子智能体收到 CLAUDE.md、派发说明与按需加载的技能，不能再派子智能体，完成后交回有界回报；其中 researcher 子智能体只能新建文件。两条线程的每次工具调用都经过工具调用钩子：PreToolUse 拦嵌套派发、拦 --no-verify，密钥守卫拦会打印密钥值的调用，只读守卫让 researcher 子智能体只能新建文件；PostToolUse 做规则文件提醒与工作树链接。主线程停止时经过 Stop 钩子：回复出口在回复以提议问句收尾或不是中文时拦停一次，上下文水位闸门要求写出交接文件。" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>架构图：主线程（编排者）收到 CLAUDE.md、经 SessionStart 钩子注入的编排手册，以及按需加载的技能。主线程向子智能体发出派发说明；子智能体收到 CLAUDE.md、派发说明与按需加载的技能，不能再派子智能体，完成后交回有界回报；其中 researcher 子智能体只能新建文件。两条线程的每次工具调用都经过工具调用钩子：PreToolUse 拦嵌套派发、拦 --no-verify，密钥守卫拦会打印密钥值的调用，只读守卫让 researcher 子智能体只能新建文件；PostToolUse 做规则文件提醒与工作树链接。主线程停止时经过 Stop 钩子：回复出口在回复以提议问句收尾或不是中文时拦停一次，上下文水位闸门要求写出交接文件。</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#9198a1"/></marker></defs>
<g id="main" transform="translate(274,8)">
<rect x="0.75" y="0.75" width="274.5" height="226.5" rx="8" fill="#0c2d6b" stroke="#4493f8" stroke-width="1.5"/>
<text x="16" y="29" font-size="15" font-weight="600" fill="#e6edf3">主线程</text>
<text x="16" y="47" font-size="12.5" fill="#9198a1">编排者</text>
<line x1="1.5" y1="55" x2="274.5" y2="55" stroke="#1f4f96" stroke-width="1"/>
<text x="16" y="85.5" font-size="13.5" fill="#e6edf3">CLAUDE.md</text>
<rect x="8" y="98" width="244" height="30" rx="5" fill="#3d1f00" stroke="#f0883e" stroke-width="1.25"/>
<text x="16" y="117.5" font-size="13.5" fill="#ffa657">编排手册，经 SessionStart 钩子注入</text>
<text x="16" y="149.5" font-size="13.5" fill="#e6edf3">技能，按需加载</text>
</g>
<g id="subagent" transform="translate(634,8)">
<rect x="0.75" y="0.75" width="196.5" height="226.5" rx="8" fill="#0c2d6b" stroke="#4493f8" stroke-width="1.5"/>
<text x="16" y="29" font-size="15" font-weight="600" fill="#e6edf3">子智能体</text>
<line x1="1.5" y1="55" x2="196.5" y2="55" stroke="#1f4f96" stroke-width="1"/>
<text x="16" y="85.5" font-size="13.5" fill="#e6edf3">CLAUDE.md</text>
<text x="16" y="117.5" font-size="13.5" fill="#e6edf3">派发说明</text>
<text x="16" y="149.5" font-size="13.5" fill="#e6edf3">技能，按需加载</text>
<line x1="1.5" y1="164" x2="196.5" y2="164" stroke="#1f4f96" stroke-width="1" stroke-dasharray="3 3"/>
<text x="16" y="188.5" font-size="13.5" fill="#ff7b72">不能再派子智能体</text>
<text x="16" y="208.5" font-size="13.5" fill="#ff7b72">researcher：只能新建文件</text>
</g>
<g id="hooks" transform="translate(274,292)">
<rect x="0.75" y="0.75" width="556.5" height="178.5" rx="8" fill="#151b23" stroke="#9198a1" stroke-width="1.5"/>
<text x="279" y="29" font-size="15" font-weight="600" text-anchor="middle" fill="#e6edf3">工具调用钩子</text>
<text x="16" y="56.5" font-size="13.5" font-weight="600" fill="#e6edf3">PreToolUse</text>
<text x="16" y="76.5" font-size="13.5" fill="#e6edf3">拦嵌套派发</text>
<text x="16" y="96.5" font-size="13.5" fill="#e6edf3">拦 --no-verify</text>
<text x="16" y="116.5" font-size="13.5" fill="#e6edf3">密钥守卫：拦会打印密钥值的调用</text>
<text x="16" y="140.5" font-size="13.5" fill="#e6edf3">只读守卫：researcher 子智能体</text>
<text x="28" y="160.5" font-size="13.5" fill="#e6edf3">只能新建文件</text>
<text x="295" y="56.5" font-size="13.5" font-weight="600" fill="#e6edf3">PostToolUse</text>
<text x="295" y="76.5" font-size="13.5" fill="#e6edf3">规则文件提醒</text>
<text x="295" y="96.5" font-size="13.5" fill="#e6edf3">工作树链接</text>
<line x1="279" y1="40" x2="279" y2="170" stroke="#3d444d" stroke-width="1"/>
<line x1="1.5" y1="38" x2="556.5" y2="38" stroke="#3d444d" stroke-width="1"/>
</g>
<g id="stop" transform="translate(8,64)">
<rect x="0.75" y="0.75" width="192.5" height="114.5" rx="8" fill="#151b23" stroke="#9198a1" stroke-width="1.5"/>
<text x="97" y="29" font-size="15" font-weight="600" text-anchor="middle" fill="#e6edf3">Stop 钩子</text>
<line x1="1.5" y1="38" x2="192.5" y2="38" stroke="#3d444d" stroke-width="1"/>
<text x="16" y="56.5" font-size="13.5" fill="#e6edf3">回复出口：以提议问句收尾</text>
<text x="28" y="76.5" font-size="13.5" fill="#e6edf3">或不是中文时拦停一次</text>
<text x="16" y="100.5" font-size="13.5" fill="#e6edf3">上下文水位闸门</text>
</g>
<g id="handoff" transform="translate(8,236)">
<rect x="0.75" y="0.75" width="192.5" height="44.5" rx="8" fill="#0d1117" stroke="#9198a1" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="97" y="29" font-size="15" font-weight="600" text-anchor="middle" fill="#e6edf3">交接文件</text>
</g>
<path d="M550,105 L634,105" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="592" y="96" font-size="12.5" text-anchor="middle" fill="#c9d1d9">派发说明</text>
<path d="M634,139 L550,139" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="592" y="130" font-size="12.5" text-anchor="middle" fill="#c9d1d9">有界回报</text>
<path d="M412,236 L412,292" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="369.5" y="268" font-size="12.5" text-anchor="middle" fill="#c9d1d9">每次工具调用</text>
<path d="M733,236 L733,292" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="690.5" y="268" font-size="12.5" text-anchor="middle" fill="#c9d1d9">每次工具调用</text>
<path d="M274,122 L202,122" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="238" y="113" font-size="12.5" text-anchor="middle" fill="#c9d1d9">停止时</text>
<path d="M105,180 L105,236" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="75" y="212" font-size="12.5" text-anchor="middle" fill="#c9d1d9">要求写出</text>
</svg>
