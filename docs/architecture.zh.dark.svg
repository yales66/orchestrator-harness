<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1052" viewBox="0 0 1300 1052" role="img" aria-label="架构图，画的是一轮工作怎样运行。会话开始、/clear 与压缩之后，SessionStart 钩子把编排手册注入主线程，子智能体收不到。主线程向子智能体发出派发说明，子智能体交回有界回报。两条线程的每次工具调用在工具执行之前都经过 PreToolUse：子智能体内的嵌套派发、git commit --no-verify、会打印密钥值的调用，以及 researcher 与 retriever 子智能体新建文件以外的写操作都被拒绝，拒绝理由回到发起调用的线程，线程换一种做法；放行的调用交给工具执行。工具执行之后，PostToolUse 在改了规则文件时把规则文件提醒作为附加上下文送回发起调用的线程，在进入新工作树时只在磁盘上建软链，不回话。主线程想结束这一轮时经过 Stop 钩子，两个都放行则回复到达用户。上下文水位闸门过 35% 时每个会话提醒一次并放行，过 40% 拦一次，越线后水位再涨 5 个点再拦一次；回复出口在回复末句是提议问句或回复不是中文时拦一次。拦下都回到主线程。被回复出口拦下，主线程把提议的那一步做掉或用中文重写。被水位闸门第一次拦下，已有上下文能做完的收尾就做完，接下来是新的大块工作时写交接文件，提示用户换新会话；再次被拦时立即写交接文件。新会话读交接文件接着做。每个闸门只拦一次，被拦后续跑的那一轮再想停就放行。" font-family="system-ui, -apple-system, &#x27;Segoe UI&#x27;, Helvetica, Arial, sans-serif">
<title>架构图，画的是一轮工作怎样运行。会话开始、/clear 与压缩之后，SessionStart 钩子把编排手册注入主线程，子智能体收不到。主线程向子智能体发出派发说明，子智能体交回有界回报。两条线程的每次工具调用在工具执行之前都经过 PreToolUse：子智能体内的嵌套派发、git commit --no-verify、会打印密钥值的调用，以及 researcher 与 retriever 子智能体新建文件以外的写操作都被拒绝，拒绝理由回到发起调用的线程，线程换一种做法；放行的调用交给工具执行。工具执行之后，PostToolUse 在改了规则文件时把规则文件提醒作为附加上下文送回发起调用的线程，在进入新工作树时只在磁盘上建软链，不回话。主线程想结束这一轮时经过 Stop 钩子，两个都放行则回复到达用户。上下文水位闸门过 35% 时每个会话提醒一次并放行，过 40% 拦一次，越线后水位再涨 5 个点再拦一次；回复出口在回复末句是提议问句或回复不是中文时拦一次。拦下都回到主线程。被回复出口拦下，主线程把提议的那一步做掉或用中文重写。被水位闸门第一次拦下，已有上下文能做完的收尾就做完，接下来是新的大块工作时写交接文件，提示用户换新会话；再次被拦时立即写交接文件。新会话读交接文件接着做。每个闸门只拦一次，被拦后续跑的那一轮再想停就放行。</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#9198a1"/></marker><marker id="back" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#f0883e"/></marker></defs>
<g id="legend">
<path d="M16,30 L60,30" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="72" y="34.5" font-size="12.5" fill="#c9d1d9">调用或结果向前走</text>
<path d="M16,56 L60,56" fill="none" stroke="#f0883e" stroke-width="2" marker-end="url(#back)"/>
<text x="72" y="60.5" font-size="12.5" fill="#ffa657">拦下或回弯：控制回到线程</text>
</g>
<g id="sessionstart">
<rect id="ss-box" x="600.75" y="16.75" width="338.5" height="62.5" rx="8" fill="#151b23" stroke="#9198a1" stroke-width="1.5"/>
<text x="770" y="42" font-size="15" font-weight="600" text-anchor="middle" fill="#e6edf3" data-box="ss-box">SessionStart 钩子</text>
<text x="770" y="64" font-size="12.5" text-anchor="middle" fill="#9198a1" data-box="ss-box">会话开始、/clear、压缩之后</text>
</g>
<path d="M770,80 L770,150" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="782" y="110" font-size="12.5" text-anchor="start" fill="#c9d1d9">注入编排手册</text>
<text x="782" y="128" font-size="12.5" text-anchor="start" fill="#c9d1d9">只进主线程</text>
<g id="main">
<rect id="main-box" x="600.75" y="150.75" width="338.5" height="178.5" rx="8" fill="#0c2d6b" stroke="#4493f8" stroke-width="1.5"/>
<text x="616" y="179" font-size="15" font-weight="600" fill="#e6edf3" data-box="main-box">主线程</text>
<text x="616" y="197" font-size="12.5" fill="#9198a1" data-box="main-box">编排者</text>
<line x1="601.5" y1="205" x2="938.5" y2="205" stroke="#1f4f96" stroke-width="1"/>
<text x="616" y="232" font-size="13.5" fill="#e6edf3" data-box="main-box">CLAUDE.md</text>
<text x="616" y="258" font-size="13.5" fill="#e6edf3" data-box="main-box">编排手册</text>
<text x="616" y="284" font-size="13.5" fill="#e6edf3" data-box="main-box">技能，按需加载</text>
</g>
<g id="subagent">
<rect id="sub-box" x="1080.75" y="150.75" width="202.5" height="178.5" rx="8" fill="#0c2d6b" stroke="#4493f8" stroke-width="1.5"/>
<text x="1096" y="179" font-size="15" font-weight="600" fill="#e6edf3" data-box="sub-box">子智能体</text>
<line x1="1081.5" y1="205" x2="1282.5" y2="205" stroke="#1f4f96" stroke-width="1"/>
<text x="1096" y="232" font-size="13.5" fill="#e6edf3" data-box="sub-box">CLAUDE.md</text>
<text x="1096" y="258" font-size="13.5" fill="#e6edf3" data-box="sub-box">派发说明</text>
<text x="1096" y="284" font-size="13.5" fill="#e6edf3" data-box="sub-box">技能，按需加载</text>
<line x1="1081.5" y1="296" x2="1282.5" y2="296" stroke="#1f4f96" stroke-width="1" stroke-dasharray="3 3"/>
<text x="1096" y="318" font-size="12.5" fill="#9198a1" data-box="sub-box">收不到编排手册</text>
</g>
<path d="M940,215 L1080,215" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="1010" y="206" font-size="12.5" text-anchor="middle" fill="#c9d1d9">派发说明</text>
<path d="M1080,265 L940,265" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="1010" y="256" font-size="12.5" text-anchor="middle" fill="#c9d1d9">有界回报</text>
<g id="stop">
<rect id="stop-box" x="16.75" y="150.75" width="302.5" height="208.5" rx="8" fill="#151b23" stroke="#9198a1" stroke-width="1.5"/>
<text x="168" y="179" font-size="15" font-weight="600" text-anchor="middle" fill="#e6edf3" data-box="stop-box">Stop 钩子</text>
<line x1="17.5" y1="188" x2="318.5" y2="188" stroke="#3d444d" stroke-width="1"/>
<text x="32" y="210" font-size="13.5" font-weight="600" fill="#e6edf3" data-box="stop-box">上下文水位闸门</text>
<text x="32" y="230" font-size="13.5" fill="#e6edf3" data-box="stop-box">过 35%：每个会话提醒一次，放行</text>
<text x="32" y="250" font-size="13.5" fill="#e6edf3" data-box="stop-box">过 40%：拦一次</text>
<text x="32" y="270" font-size="13.5" fill="#e6edf3" data-box="stop-box">越线后再涨 5 个点：再拦，立即写交接</text>
<line x1="17.5" y1="282" x2="318.5" y2="282" stroke="#3d444d" stroke-width="1"/>
<text x="32" y="304" font-size="13.5" font-weight="600" fill="#e6edf3" data-box="stop-box">回复出口</text>
<text x="32" y="324" font-size="13.5" fill="#e6edf3" data-box="stop-box">末句是提议问句，</text>
<text x="32" y="344" font-size="13.5" fill="#e6edf3" data-box="stop-box">或回复不是中文时，拦一次</text>
</g>
<path d="M600,205 L320,205" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="460" y="196" font-size="12.5" text-anchor="middle" fill="#c9d1d9">想结束这一轮</text>
<path d="M320,265 L600,265" fill="none" stroke="#f0883e" stroke-width="2" marker-end="url(#back)"/>
<text x="460" y="256" font-size="12.5" font-weight="600" text-anchor="middle" fill="#ffa657">拦下：回到主线程</text>
<text x="460" y="285" font-size="12.5" text-anchor="middle" fill="#ffa657">回复出口：做掉提议的那一步，或用中文重写</text>
<text x="460" y="303" font-size="12.5" text-anchor="middle" fill="#ffa657">水位闸门：已有上下文能做完的收尾就做完；</text>
<text x="460" y="321" font-size="12.5" text-anchor="middle" fill="#ffa657">接下来是新的大块工作：写交接，提示换会话</text>
<text x="460" y="349" font-size="12.5" text-anchor="middle" fill="#9198a1">每个闸门只拦一次：</text>
<text x="460" y="367" font-size="12.5" text-anchor="middle" fill="#9198a1">被拦后续跑的那一轮再想停就放行</text>
<path d="M100,360 L100,420" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="112" y="394" font-size="12.5" text-anchor="start" fill="#c9d1d9">都放行</text>
<g id="user">
<rect id="user-box" x="16.75" y="420.75" width="302.5" height="56.5" rx="8" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
<text x="168" y="444" font-size="15" font-weight="600" text-anchor="middle" fill="#e6edf3" data-box="user-box">用户</text>
<text x="168" y="465" font-size="12.5" text-anchor="middle" fill="#9198a1" data-box="user-box">回复到达用户</text>
</g>
<g id="handoff">
<rect id="handoff-box" x="344.75" y="410.75" width="198.5" height="54.5" rx="8" fill="#0d1117" stroke="#9198a1" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="444" y="444" font-size="15" font-weight="600" text-anchor="middle" fill="#e6edf3" data-box="handoff-box">交接文件</text>
</g>
<path d="M620,330 L620,438 L544,438" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="632" y="400" font-size="12.5" text-anchor="start" fill="#c9d1d9">写入</text>
<g id="newsession">
<rect id="new-box" x="344.75" y="530.75" width="198.5" height="56.5" rx="8" fill="#0d1117" stroke="#9198a1" stroke-width="1.5"/>
<text x="444" y="554" font-size="15" font-weight="600" text-anchor="middle" fill="#e6edf3" data-box="new-box">新会话</text>
<text x="444" y="575" font-size="12.5" text-anchor="middle" fill="#9198a1" data-box="new-box">读交接文件，接着做</text>
</g>
<path d="M444,466 L444,530" fill="none" stroke="#9198a1" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="434" y="502" font-size="12.5" text-anchor="end" fill="#c9d1d9">开场读取</text>
<path d="M770,330 L770,480" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="782" y="400" font-size="12.5" text-anchor="start" fill="#c9d1d9">工具调用</text>
<path d="M1182,330 L1182,400 L880,400 L880,480" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="1194" y="370" font-size="12.5" text-anchor="start" fill="#c9d1d9">工具调用</text>
<g id="caller">
<rect id="caller-box" x="600.75" y="480.75" width="338.5" height="58.5" rx="8" fill="#0c2d6b" stroke="#4493f8" stroke-width="1.5"/>
<text x="770" y="505" font-size="15" font-weight="600" text-anchor="middle" fill="#e6edf3" data-box="caller-box">发起调用的线程</text>
<text x="770" y="526" font-size="12.5" text-anchor="middle" fill="#9198a1" data-box="caller-box">主线程或子智能体</text>
</g>
<path d="M770,540 L770,590" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
<g id="pre">
<rect id="pre-box" x="600.75" y="590.75" width="338.5" height="180.5" rx="8" fill="#151b23" stroke="#9198a1" stroke-width="1.5"/>
<text x="616" y="616" font-size="15" font-weight="600" fill="#e6edf3" data-box="pre-box">PreToolUse</text>
<text x="924" y="616" font-size="12.5" text-anchor="end" fill="#9198a1" data-box="pre-box">工具执行之前</text>
<line x1="601.5" y1="628" x2="938.5" y2="628" stroke="#3d444d" stroke-width="1"/>
<text x="616" y="650" font-size="13.5" fill="#e6edf3" data-box="pre-box">拦嵌套派发（只在子智能体内）</text>
<text x="616" y="676" font-size="13.5" fill="#e6edf3" data-box="pre-box">拦 git commit --no-verify</text>
<text x="616" y="702" font-size="13.5" fill="#e6edf3" data-box="pre-box">密钥守卫：拦会打印密钥值的调用</text>
<text x="616" y="728" font-size="13.5" fill="#e6edf3" data-box="pre-box">只读守卫：researcher 与 retriever 子智能体</text>
<text x="628" y="748" font-size="13.5" fill="#e6edf3" data-box="pre-box">只准新建文件</text>
</g>
<path d="M770,772 L770,816" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="782" y="798" font-size="12.5" text-anchor="start" fill="#c9d1d9">放行</text>
<g id="tool">
