<text x="1018" y="608" font-size="12.5" text-anchor="start" fill="#ffa657">调用的线程，线程</text>
<text x="1018" y="626" font-size="12.5" text-anchor="start" fill="#ffa657">换一种做法</text>
<path d="M600,962 L566,962 L566,520 L600,520" fill="none" stroke="#f0883e" stroke-width="2" marker-end="url(#back)"/>
<text x="552" y="786" font-size="12.5" text-anchor="end" fill="#ffa657">工具结果与作为附加上下文的</text>
<text x="552" y="804" font-size="12.5" text-anchor="end" fill="#ffa657">规则文件提醒，回到发起</text>
<text x="552" y="822" font-size="12.5" text-anchor="end" fill="#ffa657">调用的线程</text>
</svg>
