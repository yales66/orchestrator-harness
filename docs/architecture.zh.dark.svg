<text x="616" y="928" font-size="15" font-weight="600" fill="#e6edf3" data-box="post-box">PostToolUse</text>
<text x="924" y="928" font-size="12.5" text-anchor="end" fill="#9198a1" data-box="post-box">工具执行之后</text>
<line x1="601.5" y1="940" x2="938.5" y2="940" stroke="#3d444d" stroke-width="1"/>
