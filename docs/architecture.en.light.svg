<svg xmlns="http://www.w3.org/2000/svg" width="1068" height="508" viewBox="0 0 1068 508" role="img" aria-label="Architecture: the main thread (orchestrator) receives CLAUDE.md, the orchestrator playbook injected by the SessionStart hook, and skills on demand. It sends a brief to a subagent, which receives CLAUDE.md, the brief and skills on demand, cannot dispatch subagents, and returns a bounded report; the researcher subagent creates new files only. On every tool call from either thread, tool-call hooks run: PreToolUse denies nested dispatch and --no-verify, the secret guard denies calls that would print secret values, and the read-only guard lets researcher subagents only create new files; PostToolUse adds a rule-file reminder and worktree links. When the main thread stops, the Stop hooks run: the reply gate blocks the stop once when the reply ends by offering a next step or, with REPLY_LANG=zh, is not Chinese, and the context watermark gate requires a handoff file." font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Architecture: the main thread (orchestrator) receives CLAUDE.md, the orchestrator playbook injected by the SessionStart hook, and skills on demand. It sends a brief to a subagent, which receives CLAUDE.md, the brief and skills on demand, cannot dispatch subagents, and returns a bounded report; the researcher subagent creates new files only. On every tool call from either thread, tool-call hooks run: PreToolUse denies nested dispatch and --no-verify, the secret guard denies calls that would print secret values, and the read-only guard lets researcher subagents only create new files; PostToolUse adds a rule-file reminder and worktree links. When the main thread stops, the Stop hooks run: the reply gate blocks the stop once when the reply ends by offering a next step or, with REPLY_LANG=zh, is not Chinese, and the context watermark gate requires a handoff file.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#57606a"/></marker></defs>
<g id="main" transform="translate(409,8)">
<rect x="0.75" y="0.75" width="267.5" height="226.5" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="16" y="29" font-size="15" font-weight="600" fill="#1f2328">Main thread</text>
<text x="16" y="47" font-size="12.5" fill="#59636e">orchestrator</text>
<line x1="1.5" y1="55" x2="267.5" y2="55" stroke="#b6d7f2" stroke-width="1"/>
<text x="16" y="85.5" font-size="13.5" fill="#1f2328">CLAUDE.md</text>
<rect x="8" y="98" width="237" height="50" rx="5" fill="#fff1e5" stroke="#fb8f44" stroke-width="1.25"/>
<text x="16" y="117.5" font-size="13.5" fill="#9a3a00">orchestrator playbook,</text>
<text x="16" y="137.5" font-size="13.5" fill="#9a3a00">injected by the SessionStart hook</text>
<text x="16" y="169.5" font-size="13.5" fill="#1f2328">skills, on demand</text>
</g>
<g id="subagent" transform="translate(806,8)">
<rect x="0.75" y="0.75" width="252.5" height="226.5" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
<text x="16" y="29" font-size="15" font-weight="600" fill="#1f2328">Subagent</text>
<line x1="1.5" y1="55" x2="252.5" y2="55" stroke="#b6d7f2" stroke-width="1"/>
<text x="16" y="85.5" font-size="13.5" fill="#1f2328">CLAUDE.md</text>
<text x="16" y="117.5" font-size="13.5" fill="#1f2328">the brief</text>
<text x="16" y="149.5" font-size="13.5" fill="#1f2328">skills, on demand</text>
<line x1="1.5" y1="164" x2="252.5" y2="164" stroke="#b6d7f2" stroke-width="1" stroke-dasharray="3 3"/>
<text x="16" y="188.5" font-size="13.5" fill="#b3261e">cannot dispatch subagents</text>
<text x="16" y="208.5" font-size="13.5" fill="#b3261e">researcher: creates new files only</text>
</g>
<g id="hooks" transform="translate(409,292)">
<rect x="0.75" y="0.75" width="649.5" height="206.5" rx="8" fill="#f6f8fa" stroke="#818b98" stroke-width="1.5"/>
<text x="325.5" y="29" font-size="15" font-weight="600" text-anchor="middle" fill="#1f2328">Tool-call hooks</text>
<text x="16" y="56.5" font-size="13.5" font-weight="600" fill="#1f2328">PreToolUse</text>
<text x="16" y="76.5" font-size="13.5" fill="#1f2328">deny nested dispatch</text>
<text x="16" y="96.5" font-size="13.5" fill="#1f2328">deny --no-verify</text>
<text x="16" y="120.5" font-size="13.5" fill="#1f2328">secret guard: deny calls that</text>
<text x="28" y="140.5" font-size="13.5" fill="#1f2328">would print secret values</text>
<text x="16" y="168.5" font-size="13.5" fill="#1f2328">read-only guard: researcher</text>
<text x="28" y="188.5" font-size="13.5" fill="#1f2328">subagents may only create new files</text>
<text x="341.5" y="56.5" font-size="13.5" font-weight="600" fill="#1f2328">PostToolUse</text>
<text x="341.5" y="76.5" font-size="13.5" fill="#1f2328">rule-file reminder</text>
<text x="341.5" y="96.5" font-size="13.5" fill="#1f2328">worktree links</text>
<line x1="325.5" y1="40" x2="325.5" y2="198" stroke="#d1d9e0" stroke-width="1"/>
<line x1="1.5" y1="38" x2="649.5" y2="38" stroke="#d1d9e0" stroke-width="1"/>
</g>
<g id="stop" transform="translate(8,54)">
<rect x="0.75" y="0.75" width="319.5" height="134.5" rx="8" fill="#f6f8fa" stroke="#818b98" stroke-width="1.5"/>
<text x="160.5" y="29" font-size="15" font-weight="600" text-anchor="middle" fill="#1f2328">Stop hooks</text>
<line x1="1.5" y1="38" x2="319.5" y2="38" stroke="#d1d9e0" stroke-width="1"/>
<text x="16" y="56.5" font-size="13.5" fill="#1f2328">reply gate: blocks the stop once when</text>
<text x="28" y="76.5" font-size="13.5" fill="#1f2328">the reply ends by offering a next step</text>
<text x="28" y="96.5" font-size="13.5" fill="#1f2328">or, with REPLY_LANG=zh, is not Chinese</text>
<text x="16" y="120.5" font-size="13.5" fill="#1f2328">context watermark gate</text>
</g>
<g id="handoff" transform="translate(8,246)">
<rect x="0.75" y="0.75" width="319.5" height="44.5" rx="8" fill="#ffffff" stroke="#818b98" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="160.5" y="29" font-size="15" font-weight="600" text-anchor="middle" fill="#1f2328">Handoff file</text>
</g>
<path d="M678,105 L806,105" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="742" y="96" font-size="12.5" text-anchor="middle" fill="#3d444d">brief</text>
<path d="M806,139 L678,139" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="742" y="130" font-size="12.5" text-anchor="middle" fill="#3d444d">bounded report</text>
<path d="M544,236 L544,292" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="496.5" y="268" font-size="12.5" text-anchor="middle" fill="#3d444d">every tool call</text>
<path d="M933,236 L933,292" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="885.5" y="268" font-size="12.5" text-anchor="middle" fill="#3d444d">every tool call</text>
<path d="M409,122 L329,122" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="369" y="113" font-size="12.5" text-anchor="middle" fill="#3d444d">on stop</text>
<path d="M169,190 L169,246" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="139" y="222" font-size="12.5" text-anchor="middle" fill="#3d444d">requires</text>
</svg>
